name: Deploy to GitHub Pages

on:
  push:
    branches: [main, codex/liberty-next-20261024]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_BASE_PATH: ${{ github.ref_name == 'main' && '/-shift-scheduler' || '/-shift-scheduler/preview-next' }}
      - name: Disable Jekyll
        run: touch out/.nojekyll
      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: gh-pages
          destination_dir: ${{ github.ref_name == 'main' && '.' || 'preview-next' }}
          keep_files: true
